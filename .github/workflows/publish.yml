name: Publish reviewed images
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daisy-example-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Unit tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Authenticate publisher
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/daisy-docker
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GHCR_PUBLISH_TOKEN" ]; then
            echo 'Missing required repository secret: GHCR_PUBLISH_TOKEN' >&2
            exit 1
          fi
          printf '%s' "$GHCR_PUBLISH_TOKEN" | docker login ghcr.io --username witnium --password-stdin
      - name: Build and publish
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/daisy-docker
        run: |
          mkdir release
          docker buildx create --use --name daisy-publisher
          for service in web api worker postgres; do
            if [ "$service" = postgres ]; then dockerfile=postgres/Dockerfile; else dockerfile="services/$service/Dockerfile"; fi
            docker buildx build --platform linux/amd64,linux/arm64 \
              --file "$dockerfile" --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
              --tag "ghcr.io/witnium/daisy-example-$service:$SOURCE_REVISION" \
              --metadata-file "release/$service.json" --push .
          done
      - name: Generate and verify deployment artifact
        run: |
          node scripts/compose.mjs release
          node scripts/verify-visibility.mjs release/images.json > release/visibility.json
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "images-$SOURCE_REVISION" \
            --target "$SOURCE_REVISION" --title "Images for $SOURCE_REVISION" \
            --notes 'Reviewed source revision and digest-only Compose artifact. Visibility verified anonymously; this is not deployment or recovery proof.' \
            release/docker-compose.yaml release/images.json release/visibility.json
      - name: Commit verified Compose to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch origin main
          checkout="$RUNNER_TEMP/pinned-compose"
          git worktree add --detach "$checkout" FETCH_HEAD
          cp release/docker-compose.yaml "$checkout/docker-compose.yaml"
          git -C "$checkout" add -- docker-compose.yaml
          if git -C "$checkout" diff --cached --quiet; then
            echo 'Verified Compose is unchanged; skipping commit.'
            exit 0
          fi
          digests=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { validateCompose, services } from "./scripts/compose.mjs"; const digests = validateCompose(readFileSync("release/docker-compose.yaml", "utf8")); console.log(services.map(name => `${name}=${digests[name].slice(7, 19)}`).join(" "));')
          git -C "$checkout" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "publish: pin images $digests"
          git -C "$checkout" push origin HEAD:refs/heads/main
      - name: Remove publisher credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/daisy-docker
        run: |
          docker logout ghcr.io
          rm -rf "$DOCKER_CONFIG"
